# XcodeGen spec: `brew install xcodegen && cd ios && xcodegen` creates CalendarAlarm.xcodeproj.
name: CalendarAlarm
options:
  bundleIdPrefix: io.github.ferrau10
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  CalendarAlarmCore:
    path: Packages/CalendarAlarmCore
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    minVersion: 8.0.0
    maxVersion: 99.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CalendarAlarm:
    type: application
    platform: iOS
    sources:
      - path: CalendarAlarm
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: CalendarAlarmCore
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: CalendarAlarm/Info.plist
      properties:
        CFBundleDisplayName: Calendar Alarm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_IOS_REVERSED_CLIENT_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ferrau10.calendaralarm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  CalendarAlarm:
    build:
      targets:
        CalendarAlarm: all
