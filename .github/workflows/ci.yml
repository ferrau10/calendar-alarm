name: CI

# Kept deliberately cheap: runs only on pull requests (not on pushes to main, since squash-merging a
# green PR doesn't need a re-run), cancels superseded runs, and skips docs-only changes.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue testDebugUnitTest assembleDebug 2>&1 | tee build.log
      - name: Report failures as annotations
        if: failure()
        run: python3 .github/scripts/report_failures.py build.log
